# Project-scoped Playwright MCP server for live browser execution.
# --isolated creates a new in-memory Chrome profile for each MCP lifecycle and
# prevents cookies, cache, and other browser state from persisting to disk.
# Do not add --extension, --user-data-dir, --storage-state, or --save-session.
[mcp_servers.playwright]
command = "node"
args = [
  "node_modules/@playwright/mcp/cli.js",
  "--browser",
  "chrome",
  "--codegen",
  "none",
  "--isolated",
  "--viewport-size",
  "1280x720",
  "--output-dir",
  "reports/playwright-mcp-artifacts",
  "--caps",
  "devtools"
]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.playwright.tools.browser_click]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_select_option]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_type]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_close]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_resize]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_fill_form]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_tabs]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_evaluate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate_back]
approval_mode = "approve"

